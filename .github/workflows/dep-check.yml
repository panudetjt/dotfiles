name: dependency check
on:
  schedule:
    - cron: "17 3 * * 1" # จันทร์ 03:17 UTC (~10:17 ไทย)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run dep-check
        run: |
          set -euo pipefail
          bash scripts/dep-check.sh | tee dep-report.md
          has_updates="$(grep -c 'UPDATE AVAILABLE' dep-report.md || true)"
          echo "has_updates=$has_updates" >> "$GITHUB_OUTPUT"
        id: check
      - name: append to job summary
        if: always()
        run: cat dep-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: open or update issue
        if: steps.check.outputs.has_updates != '0'
        run: |
          gh label create dependencies --color 1d76db --force 2>/dev/null || true
          {
            echo "รายงานอัตโนมัติ (cron รายสัปดาห์) — ยกเวอร์ชันด้วย workflow_dispatch → dep-bump"
            echo
            cat dep-report.md
          } > issue-body.md
          existing="$(gh issue list --label dependencies --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file issue-body.md
          else
            gh issue create --title "dependency updates available" --body-file issue-body.md --label dependencies
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
